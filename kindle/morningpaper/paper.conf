# The Myles Times - Kindle settings (plain shell variables)

# Seconds an error message stays on screen before the home screen returns.
HOLD_SECONDS=30

# The page viewer closes by itself after this many seconds without a touch.
VIEWER_IDLE_SECONDS=600

# Morning paper: the Kindle wakes itself at WAKE_TIME (24h, local time),
# downloads the new edition and shows its front page as the sleep screen.
# GitHub prints the paper around 03:12 and 04:42 IST (often later: the Kindle keeps
# retrying every 20 minutes for 4 hours). Set AUTO_FETCH=0 to turn this off.
WAKE_TIME=05:30
AUTO_FETCH=1

# Touchscreen device. Empty = detect automatically (12th gen: /dev/input/event1).
TOUCH_DEV=

# Where the paper lives on GitHub (owner/repo). The workflow publishes
# each edition to the "paper" branch of this repo.
GITHUB_REPO=ZarryMyles/morning-paper

# PRIVATE repo? Don't put the token here. Create paper.local.conf next to
# this file containing one line:
#   GITHUB_TOKEN=github_pat_xxx
# (a fine-grained token: this repo only, "Contents: Read-only").
# paper.local.conf is git-ignored, so the token never gets committed.
GITHUB_TOKEN=

