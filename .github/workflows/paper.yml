# The newsroom: renders the front page every morning and publishes it.
#
# The edition (today.pdf, today.png cover, pages/*.png, status.json) goes to a
# separate "paper" branch that is force-pushed each run, so it never piles up
# in main's history. The Kindle downloads:
#   public repo:  https://raw.githubusercontent.com/<owner>/<repo>/paper/today.pdf
#   private repo: https://api.github.com/repos/<owner>/<repo>/contents/today.pdf?ref=paper
name: Print the paper

on:
  schedule:
    # GitHub runs scheduled jobs "best effort": during busy periods they can start
    # hours late, or be skipped. So print twice; the second run just reprints the
    # same day's paper. Times are UTC, off the hour (the :00 slots are busiest):
    - cron: "42 21 * * *"    # 03:12 IST
    - cron: "12 23 * * *"    # 04:42 IST
  workflow_dispatch: {}          # "Run workflow" button for manual editions
  push:
    branches: [main]
    paths: ["generator/**", ".github/workflows/paper.yml"]

permissions:
  contents: write                # needed to push the paper branch

concurrency:
  group: paper
  cancel-in-progress: true

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Fetch the news and print every page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # raises the GitHub search rate limit
        run: |
          python generator/paper.py --out out
          cat out/status.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the paper branch
        run: |
          cd out
          git init -q -b paper
          git config user.name  "morning-paper-bot"
          git config user.email "morning-paper-bot@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > printed_at.txt
          git add -A
          git commit -q -m "Edition of $(TZ=Asia/Kolkata date +%F)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            paper
          echo "Published $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')" >> "$GITHUB_STEP_SUMMARY"
